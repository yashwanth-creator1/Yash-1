
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Review</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: linear-gradient(135deg, #ff9966, #ff5e62);
    }

    .card {
        width: 100%;
        max-width: 550px;
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        color: #ff5722;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 7px;
    }

    input,
    textarea {
        width: 100%;
        padding: 13px;
        border: 2px solid #eee;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
    }

    input:focus,
    textarea:focus {
        border-color: #ff5722;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    .stars {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 15px 0;
    }

    .stars input {
        display: none;
    }

    .stars label {
        font-size: 42px;
        color: #ccc;
        cursor: pointer;
        margin: 0;
    }

    .stars input:checked + label {
        color: #ffc107;
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 25px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #ff5722, #ff9800);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255,87,34,0.3);
    }

    #status {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="card">

    <h1>🍕 Food Review</h1>

    <p class="subtitle">
        Tell us about your food experience!
    </p>

    <form id="reviewForm">

        <label for="name">Your Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label for="food">Food Name</label>
        <input
            type="text"
            id="food"
            placeholder="Example: Chicken Biryani"
            required
        >

        <label>Rating</label>

        <div class="stars">

            <input type="radio" name="rating" id="r1" value="1">
            <label for="r1">★</label>

            <input type="radio" name="rating" id="r2" value="2">
            <label for="r2">★</label>

            <input type="radio" name="rating" id="r3" value="3">
            <label for="r3">★</label>

            <input type="radio" name="rating" id="r4" value="4">
            <label for="r4">★</label>

            <input type="radio" name="rating" id="r5" value="5">
            <label for="r5">★</label>

        </div>

        <label for="review">Your Review</label>

        <textarea
            id="review"
            placeholder="Write your review here..."
            required
        ></textarea>

        <button type="submit">
            📧 Send Review
        </button>

        <p id="status"></p>

    </form>

</div>


<script>

document.getElementById("reviewForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const food = document.getElementById("food").value.trim();
    const review = document.getElementById("review").value.trim();

    const rating = document.querySelector(
        'input[name="rating"]:checked'
    );


    if (!rating) {
        alert("Please select a rating ⭐");
        return;
    }


    const stars = "⭐".repeat(Number(rating.value));

    const subject =
        "New Food Review - " + food;


    const body =
        "FOOD REVIEW\n\n" +
        "Name: " + name + "\n" +
        "Food: " + food + "\n" +
        "Rating: " + stars + "\n\n" +
        "Review:\n" +
        review;


    const email =
        "mailto:yashwanth57317325@gmail.com" +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);


    document.getElementById("status").innerHTML =
        "📧 Opening your email app...";


    window.location.href = email;

});

</script>

</body>
</html>
```
